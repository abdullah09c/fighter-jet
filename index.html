<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Fighter Jet Reloaded</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-skyforce-dark text-white select-none overflow-hidden m-0 p-0 w-screen h-screen">
    <!-- Game Container -->
    <div id="game-container" class="relative w-full h-full flex items-center justify-center overflow-hidden">
      <!-- Phaser Canvas Host -->
      <div id="phaser-root" class="w-full h-full"></div>

      <!-- HTML5 / Tailwind Overlay (dynamic bounds matched to game canvas) -->
      <div id="ui-overlay" class="pointer-events-none flex flex-col justify-between z-20 overflow-hidden">
        <!-- Dynamic UI will be rendered here by UI controllers -->
      </div>
    </div>

    <!-- Initial Launch Overlay -->
    <div id="start-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-skyforce-dark/95 backdrop-blur-md select-none transition-opacity duration-300">
      <div class="text-center p-6 max-w-xs sm:max-w-sm w-full bg-skyforce-panel/90 tech-border rounded-2xl shadow-2xl space-y-4">
        <!-- Emblem -->
        <div class="w-16 h-16 rounded-2xl bg-skyforce-dark border border-skyforce-accent/50 mx-auto flex items-center justify-center text-3xl shadow-lg shadow-skyforce-accent/20">
          ✈️
        </div>
        
        <div>
          <div class="text-[10px] font-bold text-skyforce-accent tracking-widest uppercase">AIR SUPERIORITY SIMULATOR</div>
          <h1 class="text-2xl sm:text-3xl font-black text-white cyan-glow tracking-wider mt-1">FIGHTER JET</h1>
          <h2 class="text-xs sm:text-sm font-bold text-skyforce-gold gold-glow tracking-widest">RELOADED</h2>
        </div>

        <button id="btn-start-game" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-skyforce-accent to-cyan-400 text-skyforce-dark font-heading font-black tracking-widest text-sm sm:text-base shadow-lg shadow-skyforce-accent/30 hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2 cursor-pointer">
          <span>▶</span>
          <span>CLICK START GAME</span>
        </button>

        <div class="flex items-center justify-center gap-1.5 text-[11px] text-gray-400 font-medium">
          <span>🔊</span>
          <span>Audio & Fullscreen Experience</span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
