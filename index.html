<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fighter Jet Reloaded</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-skyforce-dark text-white select-none overflow-hidden m-0 p-0 w-screen h-screen">
    <!-- Game Container -->
    <div id="game-container" class="relative w-full h-full flex items-center justify-center overflow-hidden">
      <!-- Phaser Canvas Host -->
      <div id="phaser-root" class="w-full h-full"></div>

      <!-- HTML5 / Tailwind Overlay (dynamic bounds matched to game canvas) -->
      <div id="ui-overlay" class="pointer-events-none flex flex-col justify-between z-20 overflow-hidden">
        <!-- Dynamic UI will be rendered here by UI controllers -->
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
